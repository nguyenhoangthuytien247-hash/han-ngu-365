<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hán Ngữ 365 · Game Bài 1</title><style>
:root{--blue:#237caa;--dark:#173d60;--bg:#f0f9ff;--line:#cce7f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dark);font-family:system-ui,-apple-system,'Arial',sans-serif}header{background:linear-gradient(120deg,#d3efff,#fff);padding:20px 15px;border-bottom:3px solid #8ed1f3;text-align:center}h1{margin:0;font-size:25px}small{color:#50718a}.wrap{max-width:700px;margin:auto;padding:15px}.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px}.tabs button{flex:none}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:18px;margin:13px 0;box-shadow:0 4px 12px #1a6b9a12}button{border:1px solid #9ed5f1;border-radius:12px;padding:11px 14px;background:#e7f6ff;color:#16527c;font-size:16px;font-weight:650;cursor:pointer}button.primary,.tabs button.active{background:var(--blue);color:white}button:disabled{opacity:.45}button.choice{width:100%;text-align:left;margin:5px 0}input{font-size:20px;border:2px solid #addbf4;border-radius:12px;padding:12px;width:100%;margin:10px 0}h2{font-size:20px;margin:0 0 10px}.big{font-size:72px;text-align:center;color:#113f76}.py{font-size:27px;text-align:center}.muted{color:#59788e}.status{min-height:25px;font-weight:700;margin:10px 0}.good{color:#167b55}.bad{color:#c14646}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{display:inline-block;background:#e5f6ff;border-radius:10px;padding:7px;margin:4px}.hide{display:none}.counter{color:#527b9a;font-size:14px;margin:8px 0}.note{font-size:13px;color:#627d8e;line-height:1.5}.char{font-size:46px}.practice{background:#f6fbff;padding:12px;border-radius:12px;margin:8px 0}#writer{height:260px;width:260px;margin:10px auto;touch-action:none}#recAudio{width:100%;margin:12px 0}select{font-size:16px;padding:9px;border-radius:10px;border:1px solid #a4cfe4}footer{text-align:center;font-size:12px;color:#68869b;padding:20px} .appcard{min-height:72vh}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}.grid button{min-height:65px}.grid small{font-size:13px;color:#397394}.progress{height:8px;border-radius:9px;background:#e1eff9;margin:16px 0}.progress div{height:100%;border-radius:9px;background:#389bd0}.row{margin:12px 0} @media(max-width:400px){.big{font-size:64px}} </style></head><body><header><h1>🐼 Hán Ngữ 365</h1><div>15 bài · Học từng bước</div><small>Miễn phí · Không đăng nhập · Không hình minh họa</small></header><main class="wrap"><section id="app"><div class="card appcard"><h2>Chọn bài học</h2><div class="grid"><button onclick="lesson=1;openLesson()">Bài 1 · 你好</button><button disabled>Bài 2 · Sắp có</button><button disabled>Bài 3 · Sắp có</button><button disabled>Bài 4 · Sắp có</button><button disabled>Bài 5 · Sắp có</button><button disabled>Bài 6 · Sắp có</button><button disabled>Bài 7 · Sắp có</button><button disabled>Bài 8 · Sắp có</button><button disabled>Bài 9 · Sắp có</button><button disabled>Bài 10 · Sắp có</button><button disabled>Bài 11 · Sắp có</button><button disabled>Bài 12 · Sắp có</button><button disabled>Bài 13 · Sắp có</button><button disabled>Bài 14 · Sắp có</button><button disabled>Bài 15 · Sắp có</button></div></div></section></main><footer>Nội dung dựa trên PPT Hán Ngữ 365 Bài 1 · Âm mẫu phụ thuộc giọng Trung được cài trên thiết bị</footer><script>
const rows=[['ba','bo','bi','bu','bai','bei','bao'],['pa','po','pi','pu','pai','pei','pao','pou'],['ma','mo','me','mi','mu','mai','mei','mao','mou'],['fa','fo','fu','fei','fou'],['da','de','di','du','dai','dei','dao','dou'],['ta','te','ti','tu','tai','tao','tou'],['na','ne','ni','nu','nü','nai','nei','nao','nou'],['la','le','li','lu','lü','lai','lei','lao','lou'],['ga','ge','gu','gai','gei','gao','gou'],['ka','ke','ku','kai','kei','kao','kou'],['ha','he','hu','hai','hei','hao','hou'],['yi','wu','yu']];
// Audio uses actual Hanzi with explicit tones; no Pinyin text sent to English TTS.
const audio={ba:['八','bā'],bo:['波','bō'],bi:['逼','bī'],bu:['不','bù'],bai:['白','bái'],bei:['杯','bēi'],bao:['包','bāo'],pa:['趴','pā'],po:['坡','pō'],pi:['批','pī'],pu:['普','pǔ'],pai:['拍','pāi'],pei:['陪','péi'],pao:['跑','pǎo'],pou:['剖','pōu'],ma:['妈','mā'],mo:['摸','mō'],me:['么','me'],mi:['米','mǐ'],mu:['木','mù'],mai:['买','mǎi'],mei:['美','měi'],mao:['猫','māo'],mou:['某','mǒu'],fa:['发','fā'],fo:['佛','fó'],fu:['福','fú'],fei:['飞','fēi'],fou:['否','fǒu'],da:['大','dà'],de:['的','de'],di:['低','dī'],du:['读','dú'],dai:['带','dài'],dei:['得','děi'],dao:['到','dào'],dou:['豆','dòu'],ta:['他','tā'],te:['特','tè'],ti:['题','tí'],tu:['土','tǔ'],tai:['太','tài'],tao:['桃','táo'],tou:['头','tóu'],na:['拿','ná'],ne:['呢','ne'],ni:['你','nǐ'],nu:['努','nǔ'],nü:['女','nǚ'],nai:['奶','nǎi'],nei:['内','nèi'],nao:['脑','nǎo'],nou:['耨','nòu'],la:['拉','lā'],le:['乐','lè'],li:['里','lǐ'],lu:['路','lù'],lü:['绿','lǜ'],lai:['来','lái'],lei:['累','lèi'],lao:['老','lǎo'],lou:['楼','lóu'],ga:['嘎','gā'],ge:['哥','gē'],gu:['古','gǔ'],gai:['该','gāi'],gei:['给','gěi'],gao:['高','gāo'],gou:['狗','gǒu'],ka:['卡','kǎ'],ke:['可','kě'],ku:['哭','kū'],kai:['开','kāi'],kao:['考','kǎo'],kou:['口','kǒu'],ha:['哈','hā'],he:['喝','hē'],hu:['虎','hǔ'],hai:['海','hǎi'],hei:['黑','hēi'],hao:['好','hǎo'],hou:['后','hòu'],yi:['一','yī'],wu:['五','wǔ'],yu:['鱼','yú']};
const vocab=[['你','nǐ','bạn','đại từ','亻 (nhân đứng) + 冖 (mịch) + 小 (tiểu)'],['好','hǎo','tốt; khỏe','tính từ','女 (nữ) + 子 (tử)'],['你好','nǐ hǎo','xin chào','cụm từ','你 + 好'],['一','yī','một','số từ','一'],['五','wǔ','năm','số từ','五'],['八','bā','tám','số từ','八'],['大','dà','to, lớn','tính từ','大'],['不','bù','không','phó từ','不'],['口','kǒu','miệng','danh từ','口'],['白','bái','trắng','tính từ','白'],['女','nǚ','phụ nữ','danh từ','女'],['马','mǎ','ngựa','danh từ','马']];
const toneData=[['八','bā','ba',0],['马','mǎ','ma',2],['大','dà','da',3],['你','nǐ','ni',2],['好','hǎo','hao',2],['五','wǔ','wu',2],['白','bái','bai',1],['口','kǒu','kou',2],['给','gěi','gei',2]];
const toneVowels={a:['ā','á','ǎ','à'],e:['ē','é','ě','è'],i:['ī','í','ǐ','ì'],o:['ō','ó','ǒ','ò'],u:['ū','ú','ǔ','ù'],'ü':['ǖ','ǘ','ǚ','ǜ']};
function mark(s,n){let v=s.includes('a')?'a':s.includes('e')?'e':s.includes('ou')?'o':s.match(/[iuü]/g)?.slice(-1)[0];return v?s.replace(v,toneVowels[v][n]):s}
let view='home',lesson=1,index=0,done=false,recorder,recUrl,writer,voices=[];const $=id=>document.getElementById(id);
function say(t){if(!window.speechSynthesis){alert('Thiết bị không hỗ trợ giọng đọc');return}speechSynthesis.cancel();voices=speechSynthesis.getVoices();let v=voices.find(x=>/^zh[-_]CN/i.test(x.lang))||voices.find(x=>/^zh/i.test(x.lang));if(!v){alert('Chưa có giọng tiếng Trung trên máy. Vui lòng bật giọng 中文（普通话）trong iPhone.');return}let u=new SpeechSynthesisUtterance(t);u.voice=v;u.lang=v.lang;u.rate=.72;speechSynthesis.speak(u)}
function btn(t,fn,primary=false){return `<button class="${primary?'primary':''}" onclick="${fn}">${t}</button>`}
function show(html){$('app').innerHTML=`<div class="card appcard">${html}</div>`;window.scrollTo(0,0)}
function top(title,total){return `<div class="row" style="justify-content:space-between">${btn('← Bài học',"openLesson()") }<b>${title}</b><span>${Math.min(index+1,total)}/${total}</span></div><div class="progress"><div style="width:${Math.min(100,100*(index+1)/total)}%"></div></div>`}
function go(v){view=v;index=0;done=false;render()}
function openLesson(){view='lesson';index=0;render()}
function next(){index++;done=false;render()}
function checked(ok){let e=$('status');e.className='status '+(ok?'good':'bad');e.textContent=ok?'✅ Đúng rồi! Nhấn Tiếp theo.':'❌ Chưa đúng. Nghe lại và thử tiếp.';if(ok){done=true;$('next').disabled=false}}
function render(){if(view==='home'){show(`<h2>🐼 Hán Ngữ 365</h2><p>Chọn bài để bắt đầu học. Mỗi lần chỉ học một mục.</p><div class="grid">${Array.from({length:15},(_,i)=>`<button ${i?'disabled':''} onclick="lesson=1;openLesson()">Bài ${i+1}${i?' · Sắp có':' · 你好'}</button>`).join('')}</div>`);return}
if(view==='lesson'){show(`<div class="row">${btn('← 15 bài',"go('home')")}</div><h2>Bài 1 · 你好</h2><p>Chọn phần muốn học:</p><div class="grid">${[['sound','🔊 Luyện âm từng dòng'],['vocab','📚 Từ vựng từng từ'],['listen','⌨️ Nghe – gõ Pinyin'],['tone','🎵 Chọn thanh điệu'],['record','🎤 Ghi âm tự nghe'],['write','✍️ Luyện viết'],['quiz','🧩 Trắc nghiệm']].map(([v,t])=>btn(t,`go('${v}')`)).join('')}</div>`);return}
if(view==='sound'){if(index>=rows.length){show(top('Luyện âm',rows.length)+'<h2>🎉 Hoàn thành!</h2>'+btn('Về bài học',"openLesson()",true));return}let row=rows[index];show(top('Luyện âm từng dòng',rows.length)+`<h2>Nhóm ${index+1} · ${row[0][0].toUpperCase()}</h2><p class="note">Nhấn từng âm để nghe. Dấu thanh bên dưới cho biết thanh của <b>âm mẫu thực tế</b>, không phải thanh bắt buộc của mọi cách ghép âm.</p><div class="grid">${row.map(x=>audio[x]?`<button onclick="say('${audio[x][0]}')"><strong>${x}</strong><small style="display:block">🔊 ${audio[x][1]}</small></button>`:`<button disabled>${x}<small style="display:block">Chưa có âm mẫu</small></button>`).join('')}</div><div class="row">${index?btn('← Dòng trước',"index--;render()"):''}${btn('Đã học · Dòng tiếp →',"next()",true)}</div><p class="note">Âm mẫu sử dụng chữ Hán có thanh cụ thể; chất lượng giọng phụ thuộc giọng Trung của iPhone. Âm chưa kiểm chứng sẽ không phát bừa.</p>`);return}
if(view==='vocab'){if(index>=vocab.length){show(top('Từ vựng',vocab.length)+'<h2>🎉 Học xong từ vựng!</h2>'+btn('Về bài học',"openLesson()",true));return}let [c,p,m,part,parts]=vocab[index];show(top('Từ vựng',vocab.length)+`<div class="big">${c}</div><div class="py">${p}</div><p style="text-align:center">${m} · ${part}</p><p><b>Cấu tạo:</b> ${parts}</p><div class="row" style="justify-content:center">${btn('🔊 Nghe tiếng Trung',`say('${c}')`)}${btn('✍️ Xem / luyện nét',`stroke('${c}')`)}</div><div id="strokeBox"></div><div class="row">${index?btn('← Từ trước',"index--;render()"):''}${btn('Đã học · Từ tiếp →',"next()",true)}</div>`);return}
if(view==='listen'){let pool=Object.keys(audio).filter(x=>x!=='kei');if(index>=pool.length){show('<h2>🎉 Hoàn thành!</h2>'+btn('Về bài học',"openLesson()"));return}let x=pool[index];show(top('Nghe – gõ Pinyin',pool.length)+`<p>Nghe và nhập Pinyin <b>không dấu thanh</b>.</p><div style="text-align:center">${btn('🔊 Nghe âm',`say('${audio[x][0]}')`,true)}</div><input id="ans" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Nhập Pinyin"><button onclick="checkListen('${x}')">✓ Kiểm tra đáp án</button><div id="status" class="status"></div><button id="next" disabled onclick="next()">Câu tiếp theo →</button>`);$('ans').addEventListener('keydown',e=>{if(e.key==='Enter')checkListen(x)});return}
if(view==='tone'){if(index>=toneData.length){show('<h2>🎉 Hoàn thành!</h2>'+btn('Về bài học',"openLesson()"));return}let [c,p,s,n]=toneData[index];show(top('Nghe – chọn thanh điệu',toneData.length)+`<p>Nghe rồi chọn thanh điệu đúng.</p><div style="text-align:center">${btn('🔊 Nghe âm',`say('${c}')`,true)}</div><div class="grid">${[0,1,2,3].map(i=>btn('ABCD'[i]+'. '+mark(s,i),`checked(${i===n})`)).join('')}</div><div id="status" class="status"></div><button id="next" disabled onclick="next()">Câu tiếp theo →</button>`);return}
if(view==='record'){if(index>=rows.length){show('<h2>🎉 Hoàn thành!</h2>'+btn('Về bài học',"openLesson()"));return}let x=rows[index].filter(s=>audio[s]);show(top('Nghe – ghi âm – tự nghe',rows.length)+`<p>Nghe từng âm trong dòng, rồi ghi âm giọng mình.</p><div class="grid">${x.map(s=>btn('🔊 '+audio[s][1],`say('${audio[s][0]}')`)).join('')}</div><div class="row"><button id="startRec" onclick="startRec()">🎤 Bắt đầu ghi âm</button><button id="stopRec" disabled onclick="stopRec()">⏹ Dừng</button></div><audio id="recAudio" controls hidden style="width:100%;margin:12px 0"></audio><div id="status" class="status"></div>${btn('Đã luyện · Dòng tiếp →',"next()",true)}`);return}
if(view==='write'){if(index>=vocab.length){show('<h2>🎉 Hoàn thành!</h2>'+btn('Về bài học',"openLesson()"));return}let c=vocab[index][0];show(top('Luyện viết',vocab.length)+`<div class="big">${c}</div><div id="strokeBox"></div><div id="status" class="status"></div><button id="next" disabled onclick="next()">Viết đúng · Tiếp theo →</button>`);stroke(c,true);return}
if(view==='quiz'){if(index>=vocab.length){show('<h2>🎉 Hoàn thành!</h2>'+btn('Về bài học',"openLesson()"));return}let v=vocab[index];let opts=[v[2],...vocab.filter((_,i)=>i!==index).slice(0,3).map(x=>x[2])].sort((a,b)=>a.localeCompare(b));show(top('Chọn nghĩa',vocab.length)+`<div class="big">${v[0]}</div><div class="grid">${opts.map(o=>btn(o,`checked(${JSON.stringify(o===v[2])})`)).join('')}</div><div id="status" class="status"></div><button id="next" disabled onclick="next()">Câu tiếp theo →</button>`);return}}
function checkListen(a){let v=$('ans').value.trim().toLowerCase().replace(/u:/g,'ü');checked(v===a)}
async function startRec(){try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});let chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let b=new Blob(chunks,{type:recorder.mimeType});if(recUrl)URL.revokeObjectURL(recUrl);recUrl=URL.createObjectURL(b);$('recAudio').src=recUrl;$('recAudio').hidden=false;stream.getTracks().forEach(t=>t.stop());$('status').textContent='Đã ghi âm. Nhấn ▶ để nghe lại.'};recorder.start();$('startRec').disabled=true;$('stopRec').disabled=false;$('status').textContent='🔴 Đang ghi âm...'}catch(e){$('status').textContent='Hãy cho phép Safari sử dụng micro.'}}
function stopRec(){if(recorder?.state==='recording')recorder.stop();$('startRec').disabled=false;$('stopRec').disabled=true}
function stroke(chars,required=false){let box=$('strokeBox');if(!box)return;let charsArr=[...chars];let j=0;box.innerHTML='<p class="note">Luyện đúng thứ tự nét (cần mạng để tải dữ liệu chuẩn).</p><div id="writer" style="height:260px;width:260px"></div><div class="row"><button id="animateStroke">▶ Xem cách viết</button><button id="retryStroke">↻ Viết lại</button></div><div id="strokeStatus" class="status"></div>';let start=()=>{let c=charsArr[j];$('writer').innerHTML='';let w=HanziWriter.create('writer',c,{width:260,height:260,padding:12,showOutline:true,showCharacter:false});$('animateStroke').onclick=()=>w.animateCharacter();let quiz=()=>w.quiz({onMistake:()=>{$('strokeStatus').textContent='Sai nét, thử lại nhé.'},onComplete:()=>{j++;if(j<charsArr.length){$('strokeStatus').textContent='Đúng! Chữ tiếp theo.';start()}else{$('strokeStatus').textContent='✅ Đã viết đúng!';if(required)$('next').disabled=false}}});$('retryStroke').onclick=quiz;quiz()};if(window.HanziWriter){start();return}let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js';s.onload=start;s.onerror=()=>{$('strokeStatus').textContent='Không tải được dữ liệu nét viết. Vui lòng kiểm tra mạng.'};document.head.appendChild(s)}
try{render()}catch(err){document.getElementById('app').insertAdjacentHTML('beforeend','<p class=note>Không thể tải màn hình. Vui lòng thử lại.</p>');console.error(err)}if(window.speechSynthesis && typeof speechSynthesis.addEventListener==='function'){speechSynthesis.addEventListener('voiceschanged',()=>{voices=speechSynthesis.getVoices()})}
</script></body></html>
