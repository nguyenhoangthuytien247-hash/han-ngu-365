function mountWriting(chars,practiceOnly=false){const area=document.getElementById('writingArea');if(!area)return;const letters=[...chars];area.innerHTML=`<div class="row">${letters.map((c,i)=>`<button class="btn ${i===0?'primary':''}" data-action="pickChar" data-value="${i}">${c}</button>`).join('')}</div><div class="writing" id="writingBox"><div id="characterTarget"></div></div><div class="row">${practiceOnly?'':button('▶ Viết mẫu','animate')}${button('✍️ Tô thử','practice')}${button('↻ Làm lại','resetWriter')}</div><div id="writingStatus" class="status" aria-live="polite"></div>`;window.currentChars=letters;loadChar(letters[0])}
function loadChar(c){writer=null;writerChar=c;const t=document.getElementById('characterTarget'),s=document.getElementById('writingStatus');if(!t)return;t.innerHTML='';s.textContent='Đang tải dữ liệu nét chuẩn…';if(typeof HanziWriter==='undefined'){s.textContent='Không tải được thư viện luyện nét. Cần kết nối mạng.';return}try{writer=HanziWriter.create('characterTarget',c,{width:296,height:296,padding:14,showOutline:true,showCharacter:false,strokeColor:'#286b90',outlineColor:'#d4e4ed',drawingColor:'#2583bf',showHintAfterMisses:2,charDataLoader:(char,onComplete,onError)=>fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data@latest/'+encodeURIComponent(char)+'.json').then(r=>{if(!r.ok)throw Error('Không có dữ liệu chữ');return r.json()}).then(onComplete).catch(onError),onLoadCharDataSuccess:()=>{if(document.getElementById('writingStatus'))document.getElementById('writingStatus').textContent='Sẵn sàng. Nhấn Viết mẫu hoặc Tô thử.'},onLoadCharDataError:()=>{if(document.getElementById('writingStatus'))document.getElementById('writingStatus').textContent='Chưa tải được dữ liệu nét. Hãy kiểm tra mạng.'}})}catch(e){s.textContent='Không thể mở luyện nét: '+e.message}}
function writerAction(kind){const s=document.getElementById('writingStatus');if(!writer){if(s)s.textContent='Chưa có dữ liệu nét viết.';return}if(kind==='animate'){s.textContent='Đang viết mẫu…';writer.animateCharacter({onComplete:()=>{if(s)s.textContent='Đã xem xong mẫu.'}})}else if(kind==='practice'){s.textContent='Viết đúng từng nét theo thứ tự. Sai thì thử lại.';writer.quiz({onComplete:()=>{if(s)s.textContent='✅ Viết đúng tất cả các nét!'}})}else{loadChar(writerChar)}}
async function startRecord(){const el=document.getElementById('recordArea');if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){el.textContent='Trình duyệt này không hỗ trợ ghi âm.';return}try{recStream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];recording=new MediaRecorder(recStream);const activeRecorder=recording;recording.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recording.onstop=()=>{if(!chunks.length){el.textContent='Không thu được âm thanh. Hãy thử ghi lại.';recStream?.getTracks().forEach(t=>t.stop());return}if(recordUrl)URL.revokeObjectURL(recordUrl);recordUrl=URL.createObjectURL(new Blob(chunks,{type:activeRecorder.mimeType||chunks[0].type||'audio/webm'}));if(el)el.innerHTML='<p>Đã ghi âm. Nhấn phát để tự nghe lại:</p><audio controls style="width:100%" src="'+recordUrl+'"></audio>';recStream?.getTracks().forEach(t=>t.stop())};recording.start();el.textContent='🔴 Đang ghi âm…'}catch(e){el.textContent='Không truy cập được micro. Hãy cấp quyền micro trong Safari.'}}
function stopRecord(){if(recording?.state==='recording')recording.stop()}
app.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,v=b.dataset.value;try{if(a==='toneSix')complete(v===vocab[idx].p.split(' / ')[0]);else if(a==='checkTranslation'){const q=translationSix[idx],x=cleanChinese(document.getElementById('translationInput').value);complete([q.h,...(q.h==='我的爸爸'?['我爸爸']:q.h==='我学习汉语。'?['我学汉语','我学习中文','我学中文']:q.h==='你学习什么？'?['你学什么']:[])].some(y=>cleanChinese(y)===x))}else if(a==='hintTranslation'){const q=translationSix[idx];document.getElementById('hintSix').innerHTML=esc(q.h)+'<br>'+esc(q.p)+'<br>'+`<button data-action="say" data-value="${esc(q.h)}">🔊 Nghe câu mẫu</button>`}else if(a==='chooseLesson')selectLesson(Number(v));else if(a.startsWith('group-'))change(a);else if(['home','lesson','sound','vocab','listen','tone','record','dialogue','quiz','quizMeaning','quizHanzi','quizAudioMeaning','quizWrite','practicePinyin','reorder','grammar','exercise','reviewGrammar','translateSix'].includes(a))change(a);else if(a==='reviewAnswer')complete(v===reviewGrammar[idx][1]);else if(a==='next')next();else if(a==='pickWord'){const k=Number(v);if(!reorderPick.includes(k)){reorderPick.push(k);render()}}else if(a==='clearWords'){reorderPick=[];render()}else if(a==='checkWords'){const q=(currentLesson===16?reviewOrder:currentLesson===6?reorderSix:currentLesson===5?reorderFive:currentLesson===4?reorderFour:currentLesson===3?reorderThree:reorderTwo)[idx];complete(reorderPick.map(i=>q.words[i]).join('')===q.answer)}else if(a==='say'&&v)speak(v);else if(a==='sayPhrase')speak(v);else if(a==='sayVocab')speak(vocab[idx].h);else if(a==='sayHello')speak('你好');else if(a==='sayDialogue')speak(currentLesson===6?dialogueSix[idx].h:currentLesson===5?dialogueFive[idx].h:currentLesson===4?dialogueFour[idx].h:currentLesson===3?dialogueThree[idx].h:currentLesson===2?dialogueTwo[idx].h:'你好');else if(a==='roleA'||a==='roleB'){dialogRole=a==='roleA'?'A':'B';idx=0;render()}else if(a==='revealListen'){const k=listenKey();const el=document.getElementById('answer');el.value=audio[k][1];feedback('💡 Đáp án: '+audio[k][1]+' ('+audio[k][1]+'). Nhấn Kiểm tra đáp án để tiếp tục.',true);el.focus()}else if(a==='chooseReview'){const field=screen==='quizHanzi'?'h':'m';complete(v===vocab[idx][field]);}else if(a==='sayCurrent'){if(screen==='listen')speak(audio[listenKey()][0]);if(screen==='tone')speak(toneData[idx][0])}else if(a==='checkListen'){let entered=document.getElementById('answer').value;complete(normalize(entered)===normalize(audio[listenKey()][1]))}else if(a==='chooseTone')complete(Number(v)===toneData[idx][3]);else if(a==='chooseQuiz')complete(v===vocab[idx].m);else if(a==='pickChar'){const c=window.currentChars[Number(v)];if(c){document.querySelectorAll('[data-action="pickChar"]').forEach(x=>x.classList.toggle('primary',x.dataset.value===v));loadChar(c)}}else if(a==='animate'||a==='practice'||a==='resetWriter')writerAction(a==='resetWriter'?'reset':a);else if(a==='recordStart')startRecord();else if(a==='recordStop')stopRecord()}catch(err){console.error(err);feedback('Có lỗi: '+err.message,false)}});

async function verifyAccess(){if(accessBusy)return;accessBusy=true;try{
 const grant=JSON.parse(localStorage.getItem('hng365-login-24h')||'null');
 if(!grant||!Number.isFinite(grant.until)||grant.until<=Date.now())throw Error('Phiên truy cập đã hết hạn hoặc chưa đăng nhập. Vui lòng đăng nhập lại trên website.');
 if(!accessDB)throw Error('Không thể kết nối hệ thống. Vui lòng thử lại.');
 const {data,error}=await accessDB.auth.getUser();if(error||!data.user||data.user.id!==grant.uid)throw Error('Vui lòng đăng nhập lại trên website.');
 const {data:valid,error:ve}=await accessDB.rpc('hng365_session_valid');if(ve||valid!==true)throw Error('Phiên học không còn hợp lệ. Vui lòng đăng nhập lại.');
 const {data:p,error:pe}=await accessDB.from('profiles').select('active,role,hsk_levels,expires_at').eq('id',data.user.id).maybeSingle();
 if(pe||!p||!p.active||(p.expires_at&&new Date(p.expires_at)<=new Date())||(p.role!=='admin'&&!p.hsk_levels?.includes(1)))throw Error('Tài khoản chưa có quyền học HSK 1 hoặc đã hết hạn.');
 if(grant.until<=Date.now())throw Error('Phiên truy cập đã hết hạn.');
 if(!accessGranted){accessGranted=true;render();}
 }catch(e){lockGame(e.message||'Không thể xác minh quyền học.');}finally{accessBusy=false;}}
function checkLocalAccess(){if(!accessGranted)return;try{const g=JSON.parse(localStorage.getItem('hng365-login-24h')||'null');if(!g||g.until<=Date.now())lockGame('Phiên truy cập đã hết hạn. Vui lòng đăng nhập lại.');}catch{lockGame('Vui lòng đăng nhập lại.');}}
