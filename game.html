<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hán Ngữ 365 · Game Bài 1</title><style>
:root{--blue:#237caa;--dark:#173d60;--bg:#f0f9ff;--line:#cce7f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dark);font-family:system-ui,-apple-system,'Arial',sans-serif}header{background:linear-gradient(120deg,#d3efff,#fff);padding:20px 15px;border-bottom:3px solid #8ed1f3;text-align:center}h1{margin:0;font-size:25px}small{color:#50718a}.wrap{max-width:700px;margin:auto;padding:15px}.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px}.tabs button{flex:none}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:18px;margin:13px 0;box-shadow:0 4px 12px #1a6b9a12}button{border:1px solid #9ed5f1;border-radius:12px;padding:11px 14px;background:#e7f6ff;color:#16527c;font-size:16px;font-weight:650;cursor:pointer}button.primary,.tabs button.active{background:var(--blue);color:white}button:disabled{opacity:.45}button.choice{width:100%;text-align:left;margin:5px 0}input{font-size:20px;border:2px solid #addbf4;border-radius:12px;padding:12px;width:100%;margin:10px 0}h2{font-size:20px;margin:0 0 10px}.big{font-size:72px;text-align:center;color:#113f76}.py{font-size:27px;text-align:center}.muted{color:#59788e}.status{min-height:25px;font-weight:700;margin:10px 0}.good{color:#167b55}.bad{color:#c14646}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{display:inline-block;background:#e5f6ff;border-radius:10px;padding:7px;margin:4px}.hide{display:none}.counter{color:#527b9a;font-size:14px;margin:8px 0}.note{font-size:13px;color:#627d8e;line-height:1.5}.char{font-size:46px}.practice{background:#f6fbff;padding:12px;border-radius:12px;margin:8px 0}#writer{height:260px;width:260px;margin:10px auto;touch-action:none}#recAudio{width:100%;margin:12px 0}select{font-size:16px;padding:9px;border-radius:10px;border:1px solid #a4cfe4}footer{text-align:center;font-size:12px;color:#68869b;padding:20px}</style></head><body><header><h1>🐼 Hán Ngữ 365</h1><div>Bài 1 · 你好 · Trò chơi ôn tập</div><small>Miễn phí · Không đăng nhập · Không hình minh họa</small></header><main class="wrap"><div class="tabs" id="tabs"></div><section id="app"></section></main><footer>Nội dung dựa trên PPT Hán Ngữ 365 Bài 1 · Âm mẫu phụ thuộc giọng Trung được cài trên thiết bị</footer><script>
const initials=['b','p','m','f','d','t','n','l','g','k','h'], finals=['a','o','e','i','u','ü','ai','ei','ao','ou'];
const table=[['ba','bo','bi','bu','bai','bei','bao'],['pa','po','pi','pu','pai','pei','pao','pou'],['ma','mo','me','mi','mu','mai','mei','mao','mou'],['fa','fo','fu','fei','fou'],['da','de','di','du','dai','dei','dao','dou'],['ta','te','ti','tu','tai','tao','tou'],['na','ne','ni','nu','nü','nai','nei','nao','nou'],['la','le','li','lu','lü','lai','lei','lao','lou'],['ga','ge','gu','gai','gei','gao','gou'],['ka','ke','ku','kai','kei','kao','kou'],['ha','he','hu','hai','hei','hao','hou'],['yi','wu','yu']];
const syllables=table.flat();
const vocab=[['你','nǐ','bạn; anh/chị; mày','亻 + 冖 + 小','đại từ'],['好','hǎo','tốt, khỏe','女 + 子','tính từ'],['你好','nǐ hǎo','xin chào','你 + 好','cụm chào hỏi'],['一','yī','một','一','số từ'],['五','wǔ','năm','五','số từ'],['八','bā','tám','八','số từ'],['大','dà','to, lớn','大','tính từ'],['不','bù','không','不','phó từ'],['口','kǒu','miệng','口','danh từ'],['白','bái','màu trắng','白','danh từ'],['女','nǚ','phụ nữ','女','danh từ'],['马','mǎ','con ngựa','马','danh từ']];
const tones=[['bā','bá','bǎ','bà'],['mā','má','mǎ','mà'],['dā','dá','dǎ','dà'],['bī','bí','bǐ','bì'],['hā','há','hǎ','hà'],['wū','wú','wǔ','wù'],['nī','ní','nǐ','nì'],['kōu','kóu','kǒu','kòu'],['bū','bú','bǔ','bù'],['bāi','bái','bǎi','bài']];
const dialogues=[['A','你好！','nǐ hǎo!','Xin chào!'],['B','你好！','nǐ hǎo!','Xin chào!']];
let tab='intro',pos=0,correct=0,recorder,recordChunks=[],recUrl=null,voices=[];const $=id=>document.getElementById(id);
function say(text){if(!('speechSynthesis'in window)){alert('Trình duyệt không hỗ trợ đọc âm.');return}speechSynthesis.cancel();voices=speechSynthesis.getVoices();const zh=voices.find(v=>/^zh[-_](CN|Hans)/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang));if(!zh){alert('Thiết bị chưa có giọng đọc tiếng Trung. Vui lòng cài giọng 中文 (普通话) trong cài đặt iPhone. Không dùng giọng tiếng Anh để tránh đọc sai.');return}const u=new SpeechSynthesisUtterance(text);u.voice=zh;u.lang=zh.lang;u.rate=.78;speechSynthesis.speak(u)}
// Use Chinese characters for audio where a matching known character exists; never send Latin pinyin to English TTS.
const soundMap={ba:'八',bo:'波',bi:'逼',bu:'不',bai:'掰',bei:'杯',bao:'包',pa:'趴',po:'坡',pi:'批',pu:'扑',pai:'拍',pei:'胚',pao:'抛',pou:'剖',ma:'妈',mo:'摸',me:'么',mi:'咪',mu:'木',mai:'麦',mei:'梅',mao:'猫',mou:'谋',fa:'发',fo:'佛',fu:'夫',fei:'飞',fou:'否',da:'搭',de:'的',di:'低',du:'都',dai:'呆',dei:'得',dao:'刀',dou:'兜',ta:'他',te:'特',ti:'梯',tu:'突',tai:'胎',tao:'掏',tou:'偷',na:'那',ne:'呢',ni:'你',nu:'奴',nü:'女',nai:'奶',nei:'内',nao:'脑',nou:'耨',la:'拉',le:'了',li:'梨',lu:'路',lü:'绿',lai:'来',lei:'雷',lao:'捞',lou:'楼',ga:'嘎',ge:'哥',gu:'姑',gai:'该',gei:'给',gao:'高',gou:'沟',ka:'咖',ke:'科',ku:'哭',kai:'开',kei:'剋',kao:'考',kou:'口',ha:'哈',he:'喝',hu:'呼',hai:'嗨',hei:'黑',hao:'好',hou:'猴',yi:'一',wu:'屋',yu:'鱼'};
const toneChars=[['八','拔','把','爸'],['妈','麻','马','骂'],['搭','达','打','大'],['逼','鼻','比','闭'],['哈','蛤','好','号'],['屋','无','五','物'],['妮','泥','你','腻'],['抠','口','口','扣'],['逼','不','补','不'],['掰','白','百','拜']];
// Only use reliable tone audio: a character with the same pronunciation; if absent use explicitly labeled examples.
toneChars[7][1]='口'; toneChars[8][0]='不';
function setTab(t){tab=t;pos=0;correct=0;render()};function nav(){const ts=[['intro','🏠 Tổng quan'],['learn','📚 Ôn bài'],['listen','⌨️ Nghe gõ âm'],['tone','🎵 Thanh điệu'],['record','🎤 Ghi âm'],['write','✍️ Luyện viết'],['quiz','🧩 Trắc nghiệm'],['dialog','💬 Hội thoại']];$('tabs').innerHTML=ts.map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="setTab('${k}')">${v}</button>`).join('')}
function page(s){$('app').innerHTML=s}function next(){pos++;render()}function feedback(ok,answer){$('status').className='status '+(ok?'good':'bad');$('status').textContent=ok?'✅ Chính xác! Có thể qua câu tiếp theo.':'❌ Chưa đúng. Nghe lại và thử tiếp.';if(ok){correct++;$('next').disabled=false}}
function render(){nav();if(tab==='intro'){page(`<div class="card"><h2>Chào mừng đến Bài 1 · 你好</h2><p>Ôn thanh mẫu, vận mẫu, ghép âm, bốn thanh điệu, biến điệu thanh 3, từ vựng và hội thoại theo PPT.</p><div class="practice"><b>Trò 1:</b> Nghe âm → gõ Pinyin <b>không dấu thanh</b>. Sai không được qua.</div><div class="practice"><b>Trò 2:</b> Nghe âm có thanh điệu → chọn A/B/C/D. Sai không được qua.</div><div class="practice"><b>Luyện nói:</b> Nghe tiếng Trung → ghi âm → tự nghe lại.</div><p class="note">Không dùng Pinyin chữ Latin làm đầu vào cho giọng đọc tiếng Anh. Nếu điện thoại không có giọng Trung, ứng dụng sẽ báo rõ.</p><button class="primary" onclick="setTab('learn')">Bắt đầu học →</button></div>`);return}
if(tab==='learn'){page(`<div class="card"><h2>Thanh mẫu · 声母</h2>${initials.map(x=>`<span class="pill">${x}</span>`).join('')}<h2>Vận mẫu · 韵母</h2>${finals.map(x=>`<span class="pill">${x}</span>`).join('')}<p class="note">Các thanh mẫu đứng riêng không thể đọc chuẩn chỉ bằng TTS; luyện theo âm tiết ghép bên dưới.</p></div><div class="card"><h2>Bảng ghép âm · 拼音</h2><p>Nhấn vào âm để nghe ví dụ bằng giọng tiếng Trung.</p>${table.map((r,i)=>`<div class="practice"><b>${initials[i]||'∅'}</b><br>${r.map(x=>`<button onclick="say('${soundMap[x]}')" style="margin:3px">${x} 🔊</button>`).join('')}</div>`).join('')}</div><div class="card"><h2>Từ vựng · 生词</h2>${vocab.map(([h,p,m,c,part])=>`<div class="practice"><div class="char">${h}</div><b>${p}</b> · ${m}<br><small>${part} · Cấu tạo: ${c}</small><br><button onclick="say('${h}')">🔊 Nghe tiếng Trung</button></div>`).join('')}</div><div class="card"><h2>Biến điệu thanh 3</h2><p>Hai thanh 3 đứng liền nhau: âm đầu thường đọc thành thanh 2.</p><p class="py">nǐ + hǎo → ní hǎo</p><button onclick="say('你好')">🔊 Nghe 你好</button></div>`);return}
if(tab==='listen'){let item=syllables[pos%syllables.length];page(`<div class="card"><h2>⌨️ Nghe và gõ Pinyin</h2><div class="counter">Câu ${pos+1}/${syllables.length}</div><p>Nghe âm, nhập <b>Pinyin không có thanh điệu</b>.</p><button class="primary" onclick="say('${soundMap[item]}')">🔊 Nghe âm</button><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Nhập âm nghe được, ví dụ ba"><button onclick="checkListen('${item}')">Kiểm tra</button><div id="status" class="status"></div><button id="next" disabled onclick="next()">Câu tiếp theo →</button><p class="note">Âm được phát qua một chữ Hán ví dụ có cách đọc tương ứng. Một số âm có thể bị ảnh hưởng bởi ngữ cảnh/giọng máy; dùng âm thanh mẫu đã kiểm định khi phát hành cho học sinh.</p></div>`);$('ans').addEventListener('keydown',e=>{if(e.key==='Enter')checkListen(item)});return}
if(tab==='tone'){let ix=pos%tones.length,opts=tones[ix],idx=[2,0,3,1,2,2,2,3,3,1][ix],audio=[ '把','妈','大','鼻','好','五','你','扣','不','白'][ix];page(`<div class="card"><h2>🎵 Nghe và chọn thanh điệu</h2><div class="counter">Câu ${pos+1}/${tones.length}</div><p>Nghe tiếng Trung và chọn đáp án A/B/C/D đúng.</p><button class="primary" onclick="say('${audio}')">🔊 Nghe âm</button><div style="margin-top:15px">${opts.map((o,i)=>`<button class="choice" onclick="checkTone(${i},${idx})">${'ABCD'[i]}. ${o}</button>`).join('')}</div><div id="status" class="status"></div><button id="next" disabled onclick="next()">Câu tiếp theo →</button></div>`);return}
if(tab==='record'){let x=vocab[pos%vocab.length];page(`<div class="card"><h2>🎤 Nghe mẫu · Ghi âm · Nghe lại</h2><div class="counter">Mẫu ${pos+1}/${vocab.length}</div><div class="big">${x[0]}</div><div class="py">${x[1]}</div><p style="text-align:center">${x[2]}</p><div class="row"><button onclick="say('${x[0]}')">🔊 Nghe mẫu</button><button id="startRec" class="primary" onclick="startRecording()">🎤 Bắt đầu ghi</button><button id="stopRec" onclick="stopRecording()" disabled>⏹ Dừng</button></div><div id="status" class="status"></div><audio id="recAudio" controls class="hide"></audio><button onclick="next()">Mẫu tiếp theo →</button><p class="note">Micro chỉ dùng trên trang HTTPS (GitHub Pages) và cần quyền truy cập. Bản ghi lưu tạm trong trình duyệt, không tải lên máy chủ.</p></div>`);return}
if(tab==='dialog'){page(`<div class="card"><h2>💬 Hội thoại · 你好！</h2>${dialogues.map(([who,h,p,m])=>`<div class="practice"><b>${who}</b> · <span class="char" style="font-size:28px">${h}</span><br><span>${p}</span> · ${m}<br><button onclick="say('${h}')">🔊 Nghe</button></div>`).join('')}<button onclick="say('你好！你好！')">▶️ Nghe cả hội thoại</button><p class="note">Đây là hội thoại chào hỏi ở trang 21 của PPT.</p></div>`);return}
if(tab==='quiz'){let x=vocab[pos%vocab.length],opts=[x[2],vocab[(pos+3)%vocab.length][2],vocab[(pos+5)%vocab.length][2],vocab[(pos+7)%vocab.length][2]];page(`<div class="card"><h2>🧩 Chọn nghĩa đúng</h2><div class="counter">Câu ${pos+1}/${vocab.length}</div><div class="big">${x[0]}</div><div class="py">${x[1]}</div>${opts.map((v,i)=>`<button class="choice" onclick="checkQuiz(${i})">${'ABCD'[i]}. ${v}</button>`).join('')}<div id="status" class="status"></div><button id="next" disabled onclick="next()">Câu tiếp theo →</button></div>`);return}
if(tab==='write'){let x=vocab.filter(v=>v[0].length===1)[pos%11];page(`<div class="card"><h2>✍️ Viết chữ theo đúng thứ tự nét</h2><div class="counter">Chữ ${pos%11+1}/11</div><div class="big">${x[0]}</div><div class="py">${x[1]} · ${x[2]}</div><div id="writer"></div><div id="status" class="status"></div><div class="row"><button onclick="strokeHint()">👀 Xem nét tiếp</button><button onclick="resetWriter()">↻ Viết lại</button><button id="next" disabled onclick="next()">Chữ tiếp theo →</button></div><p class="note">Luyện nét cần tải dữ liệu Hanzi Writer từ Internet. Nếu dữ liệu không tải được, game sẽ không chấm nét thay vì chấm sai.</p></div>`);initWriter(x[0]);return}}
function checkListen(a){let v=$('ans').value.toLowerCase().trim().replace(/u:/g,'ü');feedback(v===a,a)}function checkTone(a,b){feedback(a===b)}function checkQuiz(a){feedback(a===0)}
async function startRecording(){try{if(!navigator.mediaDevices?.getUserMedia){$('status').textContent='Trình duyệt này không hỗ trợ ghi âm.';return}let stream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=()=>{let blob=new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'});if(recUrl)URL.revokeObjectURL(recUrl);recUrl=URL.createObjectURL(blob);$('recAudio').src=recUrl;$('recAudio').classList.remove('hide');stream.getTracks().forEach(t=>t.stop());$('status').textContent='✅ Đã ghi âm. Bấm ▶️ để tự nghe lại.'};recorder.start();$('startRec').disabled=true;$('stopRec').disabled=false;$('status').textContent='🔴 Đang ghi âm...'}catch(e){$('status').textContent='Không thể ghi âm. Hãy cho phép Safari truy cập micro.'}}function stopRecording(){if(recorder?.state==='recording')recorder.stop();$('startRec').disabled=false;$('stopRec').disabled=true}
let writer=null;function initWriter(char){writer=null;const load=()=>{if(!window.HanziWriter){$('status').textContent='Chưa tải được dữ liệu nét viết. Cần kết nối mạng.';return}writer=HanziWriter.create('writer',char,{width:260,height:260,padding:12,showOutline:true,showCharacter:false,strokeAnimationSpeed:1,delayBetweenStrokes:300});writer.quiz({onComplete:()=>{ $('status').className='status good';$('status').textContent='✅ Viết đúng tất cả các nét!';$('next').disabled=false},onMistake:()=>{$('status').className='status bad';$('status').textContent='❌ Nét chưa đúng, hãy thử lại.'}})};if(window.HanziWriter){load();return}let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js';s.onload=load;s.onerror=()=>{$('status').textContent='Không tải được công cụ luyện nét. Vui lòng thử lại khi có mạng.'};document.head.appendChild(s)}function resetWriter(){writer?.quiz({onComplete:()=>{$('next').disabled=false;$('status').textContent='✅ Hoàn thành!'}});$('next').disabled=true}function strokeHint(){writer?.showHint()}
speechSynthesis?.addEventListener?.('voiceschanged',()=>{voices=speechSynthesis.getVoices()});render();
</script></body></html>
