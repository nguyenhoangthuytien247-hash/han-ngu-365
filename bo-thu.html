const groups=raw.split('\n').map(line=>{let [name,...entries]=line.split('|');return {name,items:entries.map(s=>{let [c,n,p,m,e,v]=s.split(',');return {c,n,p,m,e:e.split(';').map(x=>x.split(':')),v}})}});const all=groups.flatMap(g=>g.items);

Q0 35 25 30 Q50 30 35 65 T80 70',金:'M15 76 L35 49 L80 49 L95 76 Z',贝:'M13 82 Q0 10 50 8 Q100 10 87 82 Z M50 12 L25 80 M50 12 L75 80',雨:'M15 22 Q8 7 28 7 Q42 -2 52 10 Q80 0 90 22 M20 70 L14 83 M50 72 L44 85 M80 70 L74 83',心:'M50 86 C-20 43 20 5 50 35 C80 5 120 43 50 86',力:'M15 50 Q32 15 49 30 L58 45 Q70 25 83 38 Q95 63 70 80 L30 80',言:'M10 16 Q50 0 90 16 L90 58 L65 58 L50 75 L50 58 H10 Z'};

function art(d){let col=colors[groups.findIndex(g=>g.items.includes(d))];return `<svg class="art" viewBox="0 0 100 100" aria-label="Hình liên tưởng ${d.m}"><rect x="2" y="2" width="96" height="96" rx="19" fill="${col}" opacity=".12"/><path d="${motifs[d.c]}" fill="${col}" fill-opacity=".14" stroke="${col}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="77" text-anchor="middle" font-size="73" font-family="PingFang SC, Noto Sans SC, sans-serif" fill="${col}" stroke="${col}" stroke-width=".4">${d.c}</text></svg>`}
const app=document.querySelector('#app');let unlocked=0;try{unlocked=+localStorage.getItem('han-unlock')||0}catch(e){}let g=0,i=0,q=0,questions=[],writer=null,ready=false,stamp=0;const shuffle=a=>a.slice().sort(()=>Math.random()-.5);function base(title,body){stamp++;app.innerHTML=`<header><button onclick="home()">⌂ Trang chủ</button><span>汉字奇观</span></header><h1>${title}</h1>${body}`;window.scrollTo(0,0)}function home(){base('Hán Tự Kỳ Quan','<p>Khám phá chữ Hán qua hình dáng và nét viết.</p><div class="card"><b>'+Math.min(unlocked*5,50)+' / 50 chữ đã hoàn thành</b><div class="bar"><i style="width:'+Math.min(unlocked*10,100)+'%"></i></div><span class="small">10 nhóm · học trước, luyện sau</span></div><div class="grid">'+groups.map((x,j)=>`<button class="tile" ${j>unlocked?'disabled':''} onclick="start(${j})"><span class="small">${j>unlocked?'Chưa mở':j<unlocked?'Đã học':'Nhóm '+(j+1)}</span><b class="han">${x.items[0].c} ${x.items[1].c}</b>${x.name}</button>`).join('')+'</div>')}
function start(n){g=n;i=0;lesson()}function lesson(){let d=groups[g].items[i];base(groups[g].name,`<div class="row"><span class="tag">Bài ${i+1}/5</span><span class="small">HỌC KIẾN THỨC</span></div><div class="bar"><i style="width:${(i+1)*20}%"></i></div><div class="card"><div class="hero" id="visual">${art(d)}<div id="glyph" class="big han" style="display:none">${d.c}</div><button onclick="morph()">Hình → chữ Hán</button></div><h2>${d.c} · ${d.p}</h2><p><b>Bộ ${d.n}</b> · ${d.m}${d.v?' · Dạng thường gặp: '+d.v:''}</p><p class="small">Hình trên là liên tưởng ghi nhớ, không phải hình chữ cổ.</p></div><div class="card"><h2>Thứ tự nét <span id="count" class="tag"></span></h2><div class="board" id="board"></div><div class="row"><button onclick="animate()">Viết mẫu</button><button onclick="practice()">Tô thử</button></div><p id="strokeStatus" class="small">Đang tải dữ liệu nét…</p></div><div class="card"><h2>Chữ có thành phần ${d.c}${d.v?' / '+d.v:''}</h2><p>Thường gợi ý nghĩa liên quan đến ${d.m}. Một số chữ dùng thành phần này để gợi âm hoặc có nghĩa đã biến đổi.</p><div class="examples">${d.e.map(([c,m])=>`<button onclick="this.classList.toggle('good')"><strong class="han">${c}</strong>${m}</button>`).join('')}</div><p class="small">Các ví dụ có thể chứa thành phần này nhưng không nhất thiết được tra dưới cùng một bộ thủ.</p></div><button class="primary" onclick="nextLesson()">${i===4?'Bắt đầu luyện tập':'Chữ tiếp theo'} →</button>`);loadWriter(d,false)}
function morph(){let v=document.querySelector('#visual');v.classList.add('morph');setTimeout(()=>{if(!v.isConnected)return;v.querySelector('.art').style.display='none';v.querySelector('#glyph').style.display='block';v.classList.remove('morph');},700)}
function loadWriter(d,quiz){ready=false;writer=null;let s=stamp;const status=msg=>{if(stamp===s&&document.querySelector('#strokeStatus'))document.querySelector('#strokeStatus').textContent=msg};if(!window.HanziWriter){status('Không tải được thư viện. Kiểm tra Internet rồi mở lại bài.');return}writer=HanziWriter.create('board',d.c,{width:258,height:258,padding:20,showOutline:true,showCharacter:false,strokeColor:'#286d59',outlineColor:'#d6ded3',highlightColor:'#d29747',charDataLoader:(c,onLoad,onError)=>fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/'+encodeURIComponent(c)+'.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{if(stamp!==s)return;ready=true;let el=document.querySelector('#count');if(el)el.textContent=data.strokes.length+' nét';onLoad(data);status('Viết theo đúng thứ tự và hướng nét.');if(quiz)setTimeout(()=>{if(stamp===s)practice(true)},200)}).catch(()=>{onError();status('Không tải được dữ liệu nét chữ này. Có thể thử lại khi có Internet.');if(quiz){document.querySelector('#retry').hidden=false}})} )}
function animate(){if(ready){writer.cancelQuiz();writer.animateCharacter()}}function practice(quiz=false){if(!ready)return;let s=stamp;writer.hideCharacter();writer.quiz({showHintAfterMisses:1,onMistake:()=>{if(stamp===s)document.querySelector('#strokeStatus').textContent='Thử lại nét đang được gợi ý.'},onComplete:()=>{if(stamp!==s)return;document.querySelector('#strokeStatus').textContent='Hoàn thành!';if(quiz)success()}})}function nextLesson(){if(i<4){i++;lesson()}else beginQuiz()}
const compounds=[['亻','木','休'],['女','子','好'],['马','丁','盯'],['日','月','明'],['木','木','林'],['田','力','男'],['门','口','问'],['车','仑','轮'],['钅','同','铜'],['讠','吾','语']];compounds[2]=['马','奇','骑'];function beginQuiz(){q=0;questions=[];let items=groups[g].items;for(let d of items){for(let t of [0,1,2,3,4])questions.push({d,t})}questions.push({d:items[0],t:5});quizPage()}
function quizPage(){let {d,t}=questions[q], opts=shuffle([d,...shuffle(groups[g].items.filter(x=>x!==d)).slice(0,3)]);let prompts=['Hình này gợi chữ nào?','Chọn hình phù hợp với chữ','Chọn chữ của bộ '+d.n,'Tô chữ theo đúng thứ tự','Chữ nào chứa thành phần '+d.c+'?','Ghép hai thành phần thành chữ'];let body=`<div class="row"><span class="tag">${q+1}/${questions.length}</span><span class="small">LUYỆN TẬP</span></div><div class="bar"><i style="width:${q/questions.length*100}%"></i></div><div class="card"><h2>${prompts[t]}</h2>`;if(t<3){body+=t===0?`<div class="hero">${art(d)}</div>`:t===1?`<div class="hero big han">${d.c}</div>`:'';body+=`<div class="grid" style="margin-top:15px">${opts.map(x=>`<button class="option han" onclick="answer(this,${x===d})">${t===1?art(x):x.c}</button>`).join('')}</div>`}else if(t===3){body+=`<div class="board" id="board"></div><p id="strokeStatus">Đang tải nét chữ…</p><button onclick="practice(true)">Viết lại</button><button hidden id="retry" onclick="quizPage()">Tải lại</button>`}else if(t===4){let e=d.e[0][0],wrong=shuffle(all.filter(x=>x!==d&&x.c!==e&&x.c!==d.c&&x.c!==d.v)).slice(0,3).map(x=>x.c);body+=`<div class="grid">${shuffle([e,...wrong]).map(c=>`<button class="option han" onclick="answer(this,${c===e})">${c}</button>`).join('')}</div>`}else{let [a,b,c]=compounds[g];body+=`<p>Ghép thành chữ <b class="han">${c}</b>. Chạm hoặc kéo các mảnh vào ô theo thứ tự.</p><div class="drop" id="drop">?</div><div class="grid" style="margin-top:12px">${shuffle([{c:a,k:0},{c:b,k:1}]).map(x=>`<button class="piece han" data-k="${x.k}" onclick="piece(this)" onpointerdown="drag(event,this)">${x.c}</button>`).join('')}</div>`}base(groups[g].name,body+'</div><p id="feedback"></p><button id="next" class="primary" hidden onclick="advance()">Tiếp tục →</button>');if(t===3)loadWriter(d,true);if(t===5)pieces=[]}
let pieces=[];function drag(e,el){let x=e.clientX,y=e.clientY;el.setPointerCapture(e.pointerId);el.onpointerup=ev=>{el.onpointerup=null;if(Math.hypot(ev.clientX-x,ev.clientY-y)>12){let r=document.querySelector('#drop').getBoundingClientRect();if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom)piece(el)}}}function piece(el){if(el.disabled)return;let k=+el.dataset.k;if(k!==pieces.length){feedback('Hãy thử thành phần còn lại.',false);return}pieces.push(el.textContent);el.disabled=true;document.querySelector('#drop').textContent=pieces.join(' + ');if(pieces.length===2){document.querySelector('#drop').textContent=compounds[g][2];success()}}
function feedback(msg,ok){let f=document.querySelector('#feedback');f.textContent=msg;f.className=ok?'good':'bad'}function answer(el,ok){if(ok){el.style.background='#bfe4c8';success()}else{el.style.background='#f4d9d0';feedback('Chưa đúng, thử lại nhé!',false)}}function success(){feedback('Chính xác! Bạn làm tốt lắm.',true);document.querySelectorAll('.option,.piece').forEach(b=>b.disabled=true);document.querySelector('#next').hidden=false}function advance(){q++;if(q<questions.length)quizPage();else{unlocked=Math.max(unlocked,g+1);try{localStorage.setItem('han-unlock',unlocked)}catch(e){}base('Hoàn thành!',`<div class="card"><h2>✦ ${groups[g].name}</h2><p>Bạn đã học 5 chữ và hoàn thành phần luyện tập.</p></div><button class="primary" onclick="home()">Về bản đồ học</button>${g<9?'<button class="primary" onclick="start(g+1)">Nhóm tiếp theo →</button>':''}`)}}

async function verifyAccess(){if(accessBusy)return;accessBusy=true;try{
 const grant=JSON.parse(localStorage.getItem('hng365-login-24h')||'null');
 if(!grant||!Number.isFinite(grant.until)||grant.until<=Date.now())throw Error('Phiên truy cập đã hết hạn hoặc chưa đăng nhập. Vui lòng đăng nhập lại trên website.');

 const {data:p,error:pe}=await accessDB.from('profiles').select('active,role,hsk_levels,expires_at').eq('id',data.user.id).maybeSingle();
 if(pe||!p||!p.active||(p.expires_at&&new Date(p.expires_at)<=new Date())||(p.role!=='admin'&&!p.hsk_levels?.includes(1)))throw Error('Tài khoản chưa có quyền học HSK 1 hoặc đã hết hạn.');
 if(grant.until<=Date.now())throw Error('Phiên truy cập đã hết hạn.');
 if(!accessGranted){accessGranted=true;home();}
 }catch(e){lockGame(e.message||'Không thể xác minh quyền học.');}finally{accessBusy=false;}}
