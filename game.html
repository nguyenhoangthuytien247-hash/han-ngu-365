<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hán Ngữ 365 • Game</title>
<style>
:root{--ink:#183f5b;--blue:#247cb2;--pale:#eef8ff;--line:#c6e3f6;--good:#187b5b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#e5f5ff,#f7fbff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.42;cursor:default}.shell{max-width:620px;margin:auto;min-height:100dvh;padding:20px 15px 32px}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.logo{font-size:21px;font-weight:850}.chip{border:1px solid var(--line);border-radius:30px;padding:7px 12px;background:#fff;color:#50718a;font-size:12px}.panel{background:#fff;border:1px solid #dcecf7;box-shadow:0 10px 30px #174c7010;border-radius:24px;padding:23px 20px;margin:12px 0}.eyebrow{font-size:12px;letter-spacing:.07em;font-weight:800;color:#5484a3;text-transform:uppercase}h1{font-size:29px;margin:10px 0}h2{font-size:23px;margin:9px 0 16px}p{line-height:1.6;color:#55758b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.lesson{background:#f0f9ff;border:1px solid #b7ddf3;border-radius:17px;padding:17px 4px;font-weight:800;color:var(--ink)}.lesson strong{display:block;font-size:22px}.lesson small{display:block;font-size:11px;margin-top:6px;font-weight:500}.lesson:disabled{background:#f5f7f9}.menu{display:grid;gap:11px}.menu button{text-align:left;padding:17px;border:1px solid var(--line);border-radius:16px;background:#f4fbff;font-weight:750;color:var(--ink)}.menu small{display:block;margin-top:4px;font-weight:400;color:#64829a}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.btn{background:#edf7fd;border:1px solid #bdddf1;color:var(--ink);padding:12px 16px;border-radius:13px;font-weight:750}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn.good{background:#e5f7ed;color:var(--good);border-color:#b8e4cc}.full{width:100%;margin-top:12px}.progress{height:7px;background:#e5f2fb;border-radius:10px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:#5bb4e2;transition:width .15s}.hero{font-size:84px;text-align:center;font-weight:650;margin:10px 0 0}.pinyin{text-align:center;font-size:26px;color:var(--blue);font-weight:800}.meaning{text-align:center;font-size:19px;margin:10px}.label{font-weight:800;margin:18px 0 8px}.note{font-size:13px;color:#698397}.soundgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sound{background:#e9f7ff;border:1px solid #b6dff6;border-radius:14px;padding:13px 4px;color:#19517a;font-weight:750;font-size:18px}.sound small{display:block;font-size:12px;margin-top:5px;color:#477994}.answer{width:100%;border:2px solid #bedff1;border-radius:14px;padding:15px;font-size:23px;text-align:center;outline:none}.answer:focus{border-color:#328fc6}.status{min-height:26px;margin-top:10px;font-weight:750}.error{color:#ba4b48}.success{color:#148060}.options{display:grid;grid-template-columns:1fr 1fr;gap:11px}.options button{border:1px solid #b9ddf1;background:#f0faff;border-radius:15px;padding:20px 8px;color:var(--ink);font-size:23px;font-weight:750}.options button.chosen{border:2px solid #278bc1}.writing{width:min(100%,300px);aspect-ratio:1;margin:14px auto;border:2px solid #cbdbe5;background:linear-gradient(to right,transparent calc(50% - .5px),#dbe6ed 50%,transparent calc(50% + .5px)),linear-gradient(to bottom,transparent calc(50% - .5px),#dbe6ed 50%,transparent calc(50% + .5px));position:relative;touch-action:none}.writing>div{width:100%;height:100%}.dialogue{font-size:23px;line-height:2}.hide{display:none!important}.footer{text-align:center;color:#819bb0;font-size:12px;padding:20px} @media(max-width:360px){.panel{padding:18px 14px}.soundgrid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="shell"><div class="brand"><div class="logo">🐼 Hán Ngữ 365</div><span class="chip">Miễn phí · Bài 1</span></div><div id="app"><div class="panel">Đang mở trò chơi…</div></div><div class="footer">Không cần đăng nhập · Không có hình minh họa</div></main>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js" defer></script><script>

const audio={ba:['八','bā'],bo:['波','bō'],bi:['逼','bī'],bu:['不','bù'],bai:['白','bái'],bei:['杯','bēi'],bao:['包','bāo'],pa:['趴','pā'],po:['坡','pō'],pi:['批','pī'],pu:['普','pǔ'],pai:['拍','pāi'],pei:['陪','péi'],pao:['跑','pǎo'],pou:['剖','pōu'],ma:['妈','mā'],mo:['摸','mō'],me:['么','me'],mi:['米','mǐ'],mu:['木','mù'],mai:['买','mǎi'],mei:['美','měi'],mao:['猫','māo'],mou:['某','mǒu'],fa:['发','fā'],fo:['佛','fó'],fu:['福','fú'],fei:['飞','fēi'],fou:['否','fǒu'],da:['大','dà'],de:['的','de'],di:['低','dī'],du:['读','dú'],dai:['带','dài'],dei:['得','děi'],dao:['到','dào'],dou:['豆','dòu'],ta:['他','tā'],te:['特','tè'],ti:['题','tí'],tu:['土','tǔ'],tai:['太','tài'],tao:['桃','táo'],tou:['头','tóu'],na:['拿','ná'],ne:['呢','ne'],ni:['你','nǐ'],nu:['努','nǔ'],nü:['女','nǚ'],nai:['奶','nǎi'],nei:['内','nèi'],nao:['脑','nǎo'],nou:['耨','nòu'],la:['拉','lā'],le:['乐','lè'],li:['里','lǐ'],lu:['路','lù'],lü:['绿','lǜ'],lai:['来','lái'],lei:['累','lèi'],lao:['老','lǎo'],lou:['楼','lóu'],ga:['嘎','gā'],ge:['哥','gē'],gu:['古','gǔ'],gai:['该','gāi'],gei:['给','gěi'],gao:['高','gāo'],gou:['狗','gǒu'],ka:['卡','kǎ'],ke:['可','kě'],ku:['哭','kū'],kai:['开','kāi'],kao:['考','kǎo'],kou:['口','kǒu'],ha:['哈','hā'],he:['喝','hē'],hu:['虎','hǔ'],hai:['海','hǎi'],hei:['黑','hēi'],hao:['好','hǎo'],hou:['后','hòu'],yi:['一','yī'],wu:['五','wǔ'],yu:['鱼','yú']};
const toneData=[['八','bā','ba',0],['马','mǎ','ma',2],['大','dà','da',3],['你','nǐ','ni',2],['好','hǎo','hao',2],['五','wǔ','wu',2],['白','bái','bai',1],['口','kǒu','kou',2],['给','gěi','gei',2]];
const vocab=[
{h:'你',p:'nǐ',m:'bạn, anh, chị',type:'Đại từ',parts:'亻 (nhân đứng) + 冖 (mịch) + 小 (tiểu)'},
{h:'好',p:'hǎo',m:'tốt, đẹp, hay',type:'Tính từ',parts:'女 (nữ) + 子 (tử)'},
{h:'你好',p:'nǐ hǎo',m:'xin chào',type:'Cụm chào hỏi',parts:'你 + 好'},
{h:'一',p:'yī',m:'một',type:'Số từ',parts:'一 (nhất)'},
{h:'五',p:'wǔ',m:'năm',type:'Số từ',parts:'五 (ngũ)'},
{h:'八',p:'bā',m:'tám',type:'Số từ',parts:'八 (bát)'},
{h:'大',p:'dà',m:'to, lớn',type:'Tính từ',parts:'大 (đại)'},
{h:'不',p:'bù',m:'không, chẳng',type:'Phó từ',parts:'一 (nhất) + các nét còn lại'},
{h:'口',p:'kǒu',m:'miệng; nhân khẩu',type:'Danh từ / lượng từ',parts:'口 (khẩu)'},
{h:'白',p:'bái',m:'trắng',type:'Tính từ',parts:'白 (bạch)'},
{h:'女',p:'nǚ',m:'nữ, phụ nữ',type:'Danh từ',parts:'女 (nữ)'},
{h:'马',p:'mǎ',m:'con ngựa',type:'Danh từ',parts:'马 (mã)'}
];
const app=document.getElementById('app');let screen='home',idx=0,selected=-1,passed=false,dialogRole='B',writer=null,writerChar='',recording=null,recordUrl='',recStream=null,voiceNote='';
const html=(s)=>{app.innerHTML=s;window.scrollTo({top:0,behavior:'instant'})};
const button=(text,action,cls='')=>`<button class="btn ${cls}" data-action="${action}">${text}</button>`;
const bar=(name,count)=>`<div class="row between">${button('← Bài 1','lesson')}<b>${name}</b><span class="chip">${Math.min(idx+1,count)}/${count}</span></div><div class="progress"><div style="width:${Math.min(100,(idx+1)/count*100)}%"></div></div>`;
const nav=(enabled=true)=>button('Tiếp theo →','next','primary full'+(enabled?'':' disabled'));
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function change(s){if(recording&&recording.state==='recording')stopRecord();screen=s;idx=0;selected=-1;passed=false;if(s==='listen')shuffleListen();render()}
function next(){idx++;selected=-1;passed=false;render()}
function speak(text){if(!('speechSynthesis' in window)){feedback('Thiết bị không hỗ trợ giọng đọc.',false);return}let v=window.speechSynthesis.getVoices().filter(v=>/^zh(-|_)/i.test(v.lang));if(!v.length){feedback('Chưa có giọng tiếng Trung trên thiết bị. Không dùng giọng tiếng Anh để đọc.',false);return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.voice=v.find(x=>/zh-CN/i.test(x.lang))||v[0];u.rate=.82;window.speechSynthesis.speak(u)}
function feedback(msg,ok){const e=document.getElementById('status');if(e){e.textContent=msg;e.className='status '+(ok?'success':'error')}}
function complete(ok){passed=ok;feedback(ok?'✅ Đúng rồi! Nhấn Tiếp theo.':'❌ Chưa đúng, hãy thử lại.',ok);let n=document.getElementById('nextBtn');if(n)n.disabled=!ok}
const audioKeys=Object.keys(audio).filter(k=>k!=='kei');
let listenOrder=[];
function shuffleListen(){listenOrder=[...audioKeys];for(let i=listenOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[listenOrder[i],listenOrder[j]]=[listenOrder[j],listenOrder[i]]}}
function listenKey(){return listenOrder[idx]}
shuffleListen();
const normalize=s=>s.trim().toLowerCase().replace(/u:/g,'ü').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ü/g,'v');
const toneMarks={a:['ā','á','ǎ','à'],e:['ē','é','ě','è'],i:['ī','í','ǐ','ì'],o:['ō','ó','ǒ','ò'],u:['ū','ú','ǔ','ù'],v:['ǖ','ǘ','ǚ','ǜ']};
function withTone(s,n){let t=s.replace('ü','v');let pos=t.indexOf('a');if(pos<0)pos=t.indexOf('e');if(pos<0&&t.includes('ou'))pos=t.indexOf('o');if(pos<0){for(let i=t.length-1;i>=0;i--)if('aeiouv'.includes(t[i])){pos=i;break}}return pos<0?s:t.slice(0,pos)+toneMarks[t[pos]][n]+t.slice(pos+1).replace('v','ü')}
function donePage(){html(`<section class="panel"><h1>🎉 Hoàn thành!</h1><p>Cậu đã học xong phần này.</p>${button('Về Bài 1','lesson','primary full')}</section>`)}
function render(){try{renderScreen()}catch(e){console.error(e);html(`<section class="panel"><h2>Không thể mở mục này</h2><p>${esc(e.message)}</p>${button('Về danh sách','home','primary')}</section>`)}}
function renderScreen(){
if(screen==='home'){html(`<section class="panel"><div class="eyebrow">Học từng bước · 15 bài</div><h1>Chọn bài học</h1><p>Mỗi lần một màn hình. Bài 1 có nội dung; các bài khác đang chờ cập nhật.</p><div class="grid">${Array.from({length:15},(_,i)=>`<button class="lesson" data-action="${i===0?'lesson':'locked'}" ${i?'disabled':''}><strong>${i+1}</strong><small>${i?'Sắp có':'你好 · Bắt đầu'}</small></button>`).join('')}</div></section>`);return}
if(screen==='lesson'){html(`<section class="panel"><div class="row">${button('← 15 bài','home')}</div><h1>Bài 1 · 你好</h1><p>Chọn một phần để bắt đầu. Mỗi mục có nút chuyển trang riêng.</p><div class="menu">${[['sound','🔊 Ghép âm','Nghe từng dòng, có hiển thị dấu thanh của âm mẫu'],['vocab','📚 Từ vựng','12 thẻ từ, luyện viết ngay trong mỗi thẻ'],['listen','⌨️ Nghe và gõ Pinyin','Gõ không dấu thanh, đúng mới qua'],['tone','🎵 Nghe và chọn thanh điệu','Chọn A/B/C/D'],['record','🎤 Nghe và ghi âm','Nghe mẫu → tự đọc → nghe lại'],['dialogue','💬 Hội thoại','Chào hỏi theo vai'],['quiz','🧠 Ôn tập từ vựng','4 dạng bài tập riêng biệt']].map(([s,t,d])=>`<button data-action="${s}">${t}<small>${d}</small></button>`).join('')}</div></section>`);return}
if(screen==='sound'){if(idx>=rows.length)return donePage();const row=rows[idx];html(`<section class="panel">${bar('Ghép âm từng dòng',rows.length)}<div class="eyebrow">Dòng ${idx+1} · ${esc(row[0][0].toUpperCase())}</div><h2>Nhấn từng âm để nghe</h2><p class="note">Dấu thanh bên dưới là thanh của <b>âm mẫu được phát</b>, không có nghĩa âm tiết chỉ có thanh đó.</p><div class="soundgrid">${row.map(k=>`<button class="sound" data-action="say" data-value="${esc((audio[k]||[])[0]||'')}">${esc(k)} 🔊<small>${audio[k]?esc(audio[k][1]):'Chưa có âm mẫu'}</small></button>`).join('')}</div>${button('Dòng tiếp theo →','next','primary full')}</section>`);return}
if(screen==='vocab'){if(idx>=vocab.length)return donePage();const v=vocab[idx];html(`<section class="panel">${bar('Từ vựng',vocab.length)}<div class="hero">${v.h}</div><div class="pinyin">${v.p}</div><div class="meaning">${v.m}</div><div class="row" style="justify-content:center">${button('🔊 Nghe tiếng Trung','sayVocab')}</div><div class="label">Loại từ</div><div>${v.type}</div><div class="label">Cấu tạo / thành phần chữ</div><div>${v.parts}</div><div class="label">✍️ Thứ tự nét viết</div><p class="note">Nhấn “Viết mẫu” để xem thứ tự nét; “Tô thử” để luyện đúng thứ tự.</p><div id="writingArea"></div>${button('Từ tiếp theo →','next','primary full')}</section>`);mountWriting(v.h);return}
if(screen==='listen'){if(idx>=listenOrder.length){html(`<section class="panel"><h1>🎉 Hoàn thành!</h1><p>Cậu đã luyện hết ${listenOrder.length} âm, không lặp âm trong lượt này.</p>${button('🔀 Luyện lại · Trộn mới','listen','primary full')}${button('Về Bài 1','lesson','full')}</section>`);return}const k=listenKey();html(`<section class="panel">${bar('Nghe – gõ Pinyin',listenOrder.length)}<h2>Nghe rồi gõ Pinyin 🔀</h2><p class="note">Thứ tự âm được xáo trộn mỗi lượt luyện.</p><p>Không cần dấu thanh. Ví dụ nghe <b>gěi</b> thì gõ <b>gei</b>.</p><div class="row" style="justify-content:center;margin:20px 0">${button('🔊 Nghe âm mẫu','sayCurrent','primary')}</div><input id="answer" class="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Nhập Pinyin"><button class="btn full" data-action="checkListen">Kiểm tra đáp án</button><button class="btn full" data-action="revealListen">💡 Xem đáp án</button><div id="status" class="status" aria-live="polite"></div><button id="nextBtn" class="btn primary full" data-action="next" disabled>Câu tiếp theo →</button></section>`);return}
if(screen==='tone'){if(idx>=toneData.length)return donePage();const [h,p,syll,n]=toneData[idx];html(`<section class="panel">${bar('Chọn thanh điệu',toneData.length)}<h2>Âm vừa nghe thuộc thanh nào?</h2><div class="row" style="justify-content:center;margin:20px 0">${button('🔊 Nghe âm mẫu','sayCurrent','primary')}</div><div class="options">${[0,1,2,3].map((i)=>`<button data-action="chooseTone" data-value="${i}">${'ABCD'[i]}. ${withTone(syll,i)}</button>`).join('')}</div><div id="status" class="status" aria-live="polite"></div><button id="nextBtn" class="btn primary full" data-action="next" disabled>Câu tiếp theo →</button></section>`);return}
if(screen==='record'){if(idx>=rows.length)return donePage();let row=rows[idx].filter(x=>audio[x]);html(`<section class="panel">${bar('Nghe – ghi âm',rows.length)}<h2>Luyện đọc dòng ${idx+1}</h2><p>${row.map(x=>audio[x][1]).join(' · ')}</p><div class="soundgrid">${row.map(x=>`<button class="sound" data-action="say" data-value="${esc(audio[x][0])}">${x} 🔊</button>`).join('')}</div><p class="note">Nghe từng âm, sau đó ghi âm cả dòng và tự nghe lại.</p><div class="row">${button('🎤 Bắt đầu ghi','recordStart')}${button('■ Dừng ghi','recordStop')}</div><div id="recordArea" class="status"></div>${button('Dòng tiếp theo →','next','primary full')}</section>`);return}
if(screen==='dialogue'){const turns=[{role:'A',h:'你好！',p:'Nǐ hǎo!',m:'Xin chào!'},{role:'B',h:'你好！',p:'Nǐ hǎo!',m:'Xin chào!'}];if(idx>=turns.length)return donePage();const t=turns[idx],student=t.role===dialogRole;html(`<section class="panel">${bar('Đóng vai hội thoại',turns.length)}<h2>💬 你好 · Xin chào</h2><p>Chọn vai của học sinh. Máy sẽ đọc vai còn lại.</p><div class="row">${button('Tôi đóng vai A','roleA',dialogRole==='A'?'primary':'')}${button('Tôi đóng vai B','roleB',dialogRole==='B'?'primary':'')}</div><div class="label">Lượt ${idx+1}: ${t.role} · ${student?'🎤 Học sinh':'🔊 Máy đọc'}</div><div class="hero" style="font-size:58px">${t.h}</div><div class="pinyin">${t.p}</div><div class="meaning">${t.m}</div>${student?`<p>Đọc câu của vai ${dialogRole}, ghi âm và tự nghe lại.</p><div class="row">${button('🎤 Bắt đầu ghi âm','recordStart')}${button('■ Dừng ghi','recordStop')}</div><div id="recordArea" class="status"></div>`:`<p>Nhấn để nghe máy đọc vai ${t.role}.</p>${button('🔊 Nghe lời thoại','sayDialogue','primary full')}`}<button class="btn primary full" data-action="next">${idx===turns.length-1?'Hoàn thành hội thoại →':'Lượt tiếp theo →'}</button></section>`);return}
if(screen==='quiz'){html(`<section class="panel">${button('← Bài 1','lesson')}<h2>🧠 Ôn tập từ vựng</h2><p>Chọn một trong bốn dạng bài. Mỗi dạng được luyện riêng.</p><div class="menu">${[['quizMeaning','① Nhìn chữ Hán → chọn nghĩa Việt'],['quizHanzi','② Nghe âm → chọn chữ Hán'],['quizAudioMeaning','③ Nghe âm → chọn nghĩa Việt'],['quizWrite','④ Luyện viết chữ Hán']].map(([k,t])=>`<button data-action="${k}">${t}</button>`).join('')}</div></section>`);return}
if(['quizMeaning','quizHanzi','quizAudioMeaning','quizWrite'].includes(screen)){if(idx>=vocab.length)return donePage();const v=vocab[idx],mode=screen;const titles={quizMeaning:'Nhìn chữ → chọn nghĩa',quizHanzi:'Nghe → chọn chữ Hán',quizAudioMeaning:'Nghe → chọn nghĩa',quizWrite:'Tự luyện viết chữ Hán'};const pick=mode==='quizHanzi'?'h':'m';const others=vocab.filter((x,i)=>i!==idx&&x[pick]!==v[pick]);const distract=[others[(idx*3+1)%others.length],others[(idx*3+4)%others.length],others[(idx*3+7)%others.length]];const options=[v,...distract].sort((a,b)=>a[pick].localeCompare(b[pick],'vi'));const question=mode==='quizMeaning'?`<div class="hero">${v.h}</div>`:mode==='quizWrite'?`<div class="hero" style="font-size:62px">${v.h}</div><div class="pinyin">${v.p}</div><div class="meaning">${v.m}</div>`:`<div class="row" style="justify-content:center;margin:25px 0">${button('🔊 Nghe từ','sayVocab','primary')}</div>`;html(`<section class="panel">${bar(titles[mode],vocab.length)}<div class="row">${button('← Chọn dạng ôn tập','quiz')}</div><h2>${titles[mode]}</h2>${question}${mode==='quizWrite'?`<p class="note">Không hiện viết mẫu ở phần ôn tập. Hãy tự viết đúng thứ tự nét.</p><div id="writingArea"></div><button class="btn primary full" data-action="next">Từ tiếp theo →</button>`:`<div class="options">${options.map((o,i)=>`<button style="font-size:${pick==='h'?'29':'16'}px" data-action="chooseReview" data-value="${esc(o[pick])}">${'ABCD'[i]}. ${esc(o[pick])}</button>`).join('')}</div><div id="status" class="status" aria-live="polite"></div><button id="nextBtn" class="btn primary full" data-action="next" disabled>Câu tiếp theo →</button>`}</section>`);if(mode==='quizWrite')mountWriting(v.h,true);return}

}
function mountWriting(chars,practiceOnly=false){const area=document.getElementById('writingArea');if(!area)return;const letters=[...chars];area.innerHTML=`<div class="row">${letters.map((c,i)=>`<button class="btn ${i===0?'primary':''}" data-action="pickChar" data-value="${i}">${c}</button>`).join('')}</div><div class="writing" id="writingBox"><div id="characterTarget"></div></div><div class="row">${practiceOnly?'':button('▶ Viết mẫu','animate')}${button('✍️ Tô thử','practice')}${button('↻ Làm lại','resetWriter')}</div><div id="writingStatus" class="status" aria-live="polite"></div>`;window.currentChars=letters;loadChar(letters[0])}
function loadChar(c){writer=null;writerChar=c;const t=document.getElementById('characterTarget'),s=document.getElementById('writingStatus');if(!t)return;t.innerHTML='';s.textContent='Đang tải dữ liệu nét chuẩn…';if(typeof HanziWriter==='undefined'){s.textContent='Không tải được thư viện luyện nét. Cần kết nối mạng.';return}try{writer=HanziWriter.create('characterTarget',c,{width:296,height:296,padding:14,showOutline:true,showCharacter:false,strokeColor:'#286b90',outlineColor:'#d4e4ed',drawingColor:'#2583bf',showHintAfterMisses:2,charDataLoader:(char,onComplete,onError)=>fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data@latest/'+encodeURIComponent(char)+'.json').then(r=>{if(!r.ok)throw Error('Không có dữ liệu chữ');return r.json()}).then(onComplete).catch(onError),onLoadCharDataSuccess:()=>{if(document.getElementById('writingStatus'))document.getElementById('writingStatus').textContent='Sẵn sàng. Nhấn Viết mẫu hoặc Tô thử.'},onLoadCharDataError:()=>{if(document.getElementById('writingStatus'))document.getElementById('writingStatus').textContent='Chưa tải được dữ liệu nét. Hãy kiểm tra mạng.'}})}catch(e){s.textContent='Không thể mở luyện nét: '+e.message}}
function writerAction(kind){const s=document.getElementById('writingStatus');if(!writer){if(s)s.textContent='Chưa có dữ liệu nét viết.';return}if(kind==='animate'){s.textContent='Đang viết mẫu…';writer.animateCharacter({onComplete:()=>{if(s)s.textContent='Đã xem xong mẫu.'}})}else if(kind==='practice'){s.textContent='Viết đúng từng nét theo thứ tự. Sai thì thử lại.';writer.quiz({onComplete:()=>{if(s)s.textContent='✅ Viết đúng tất cả các nét!'}})}else{loadChar(writerChar)}}
async function startRecord(){const el=document.getElementById('recordArea');if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){el.textContent='Trình duyệt này không hỗ trợ ghi âm.';return}try{recStream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];recording=new MediaRecorder(recStream);recording.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recording.onstop=()=>{if(recordUrl)URL.revokeObjectURL(recordUrl);recordUrl=URL.createObjectURL(new Blob(chunks,{type:recording.mimeType||'audio/webm'}));if(el)el.innerHTML='<p>Đã ghi âm. Nhấn phát để tự nghe lại:</p><audio controls style="width:100%" src="'+recordUrl+'"></audio>';recStream?.getTracks().forEach(t=>t.stop())};recording.start();el.textContent='🔴 Đang ghi âm…'}catch(e){el.textContent='Không truy cập được micro. Hãy cấp quyền micro trong Safari.'}}
function stopRecord(){if(recording?.state==='recording')recording.stop()}
app.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,v=b.dataset.value;try{if(['home','lesson','sound','vocab','listen','tone','record','dialogue','quiz','quizMeaning','quizHanzi','quizAudioMeaning','quizWrite'].includes(a))change(a);else if(a==='next')next();else if(a==='say'&&v)speak(v);else if(a==='sayVocab')speak(vocab[idx].h);else if(a==='sayHello')speak('你好');else if(a==='sayDialogue')speak('你好');else if(a==='roleA'||a==='roleB'){dialogRole=a==='roleA'?'A':'B';idx=0;render()}else if(a==='revealListen'){const k=listenKey();const el=document.getElementById('answer');el.value=k;feedback('💡 Đáp án: '+k+' ('+audio[k][1]+'). Nhấn Kiểm tra đáp án để tiếp tục.',true);el.focus()}else if(a==='chooseReview'){const field=screen==='quizHanzi'?'h':'m';complete(v===vocab[idx][field]);}else if(a==='sayCurrent'){if(screen==='listen')speak(audio[listenKey()][0]);if(screen==='tone')speak(toneData[idx][0])}else if(a==='checkListen'){let entered=document.getElementById('answer').value;complete(normalize(entered)===normalize(listenKey()))}else if(a==='chooseTone')complete(Number(v)===toneData[idx][3]);else if(a==='chooseQuiz')complete(v===vocab[idx].m);else if(a==='pickChar'){const c=window.currentChars[Number(v)];if(c){document.querySelectorAll('[data-action="pickChar"]').forEach(x=>x.classList.toggle('primary',x.dataset.value===v));loadChar(c)}}else if(a==='animate'||a==='practice'||a==='resetWriter')writerAction(a==='resetWriter'?'reset':a);else if(a==='recordStart')startRecord();else if(a==='recordStop')stopRecord()}catch(err){console.error(err);feedback('Có lỗi: '+err.message,false)}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='answer'){e.preventDefault();const b=app.querySelector('[data-action="checkListen"]');b?.click()}});
render();
</script></body></html>
